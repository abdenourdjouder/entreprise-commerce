spring:
  application:
    name: order-service
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service
security:
  api-key: local-dev-api-key
resilience:
  payment:
    retry:
      max-attempts: 3
      initial-delay-ms: 50
      max-delay-ms: 500
      jitter-factor: 0.25
